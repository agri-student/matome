<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リンク集ポータル</title>
<meta name="description" content="行事写真ギャラリーや授業・教材ページ、学科・部活紹介など、これまでに作成したWebサイトへのリンクをまとめたポータルサイトです。">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">
        <span class="site-title-icon" aria-hidden="true">🔗</span>
        リンク集ポータル
      </h1>
      <p class="site-subtitle">行事写真・授業教材・学科紹介など、みんなのページをここから探せます</p>

      <div class="search-wrap">
        <label for="search-input" class="visually-hidden">サイト内検索</label>
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input
            id="search-input"
            type="search"
            placeholder="タイトル・カテゴリ・説明で検索..."
            autocomplete="off"
          >
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <div id="sections-container" class="sections-container">
      <!-- カテゴリごとのセクションはJSで生成されます -->
    </div>

    <p id="no-results" class="no-results" hidden>
      見つかりませんでした。別のキーワードで検索してみてください。
    </p>

    <p id="loading-message" class="loading-message">読み込み中...</p>
  </main>

  <footer class="site-footer">
    <p>新しいページを追加する場合は <code>links.json</code> に項目を追記してください。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
